<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214f3b"><title>MONEVA｜無料サイドFIRE診断</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f0;color:#244a38;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.wrap{max-width:520px;margin:auto;padding:22px 17px 45px}header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}h1{font-size:31px;letter-spacing:2px;margin:0}.sub{font-size:12px;color:#6e866f}.apple{font-size:34px}section{background:white;border-radius:19px;padding:20px;margin:14px 0;box-shadow:0 3px 15px #244a3809}h2{font-size:19px;margin:0 0 17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;font-weight:650;display:block;margin-bottom:6px}input{width:100%;border:1px solid #dce5d8;border-radius:11px;padding:13px 9px;font-size:18px;background:#fbfcf9;color:#244a38}.unit{font-size:11px;color:#758879;margin-top:4px}.range{margin-top:17px}.rangehead{display:flex;justify-content:space-between;align-items:center}.range input{accent-color:#427456;padding:0}.result{background:#244f3b;color:white}.result h2{font-size:14px;color:#d5e9d9;margin-bottom:7px}.big{font-size:35px;font-weight:800;margin:0 0 19px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #52735f;padding-top:15px}.twocol span{display:block;font-size:11px;color:#d3e4d6}.twocol b{font-size:20px}.track{background:#53745e;border-radius:15px;height:12px;overflow:hidden}.fill{height:100%;background:#b3d99c;width:0}.status{background:#39664e;border-radius:12px;padding:12px;margin-top:17px;font-size:13px}button{border:0;background:#427956;color:white;border-radius:12px;padding:15px;font-size:15px;font-weight:700;width:100%;margin:7px 0;cursor:pointer}.fine{font-size:11px;line-height:1.65;color:#758778}.result .fine{color:#c5ddca}.foot{text-align:center;font-size:11px;color:#79917e;margin-top:25px}</style></head><body><main class="wrap"><header><div><h1>MONEVA <span style="font-size:12px;letter-spacing:0;color:#799c75">モネバ</span></h1><div class="sub">お金を育てる、自由への一歩。</div></div><div class="apple">🍎</div></header><section><h2>あなたのサイドFIRE診断</h2><div class="grid"><div><label for="age">現在の年齢</label><input id="age" type="number" min="0" max="100" value="31"><div class="unit">歳</div></div><div><label for="target">FIRE目標年齢</label><input id="target" type="number" min="0" max="110" value="40"><div class="unit">歳</div></div><div><label for="assets">現在の金融資産</label><input id="assets" type="number" min="0" value="1850"><div class="unit">万円</div></div><div><label for="save">毎月の積立額</label><input id="save" type="number" min="0" value="10"><div class="unit">万円</div></div><div><label for="cost">毎月の生活費</label><input id="cost" type="number" min="0" value="30"><div class="unit">万円</div></div><div><label for="income">副業の月間利益</label><input id="income" type="number" min="0" value="15"><div class="unit">万円・税引前</div></div></div><div class="range"><div class="rangehead"><label for="rate">想定年間運用利回り</label><b id="rateVal">3%</b></div><input id="rate" type="range" min="0" max="8" step="0.5" value="3"></div><div class="range"><div class="rangehead"><label for="draw">年間取り崩し率</label><b id="drawVal">3.5%</b></div><input id="draw" type="range" min="2" max="5" step="0.5" value="3.5"></div></section><section class="result"><h2>サイドFIREに必要な資産</h2><div class="big" id="required">—</div><div class="twocol"><div><span>目標年齢の予想資産</span><b id="future">—</b></div><div><span>必要資産との差額</span><b id="gap">—</b></div></div><p style="font-size:12px;margin:19px 0 7px">目標への到達率 <b id="percent" style="float:right">—</b></p><div class="track"><div class="fill" id="fill"></div></div><div class="status" id="status"></div><p class="fine">※一定利回りの概算。税金・社会保険・インフレ・相場の変動・贈与は反映していません。取り崩し率は安全性を保証しません。</p></section><button id="copy">診断結果をコピー</button><p class="fine">この診断は一般的な情報提供を目的とし、個別の投資助言ではありません。入力した数値はこのページ内で計算され、サーバーには送信しません。</p><div class="foot">MONEVA © 2026</div></main><script>const ids=['age','target','assets','save','cost','income','rate','draw'];const el=id=>document.getElementById(id);const v=id=>Math.max(0,Number(el(id).value)||0);const fmt=n=>Math.round(n).toLocaleString('ja-JP')+'万円';let summary='';function update(){let months=Math.max(0,Math.min(1200,Math.round((v('target')-v('age'))*12)));let r=v('rate')/1200;let factor=Math.pow(1+r,months);let future=v('assets')*factor+v('save')*(r===0?months:(factor-1)/r);let needed=Math.max(0,v('cost')-v('income'))*12/(v('draw')/100);let gap=Math.max(0,needed-future);let progress=needed===0?100:Math.min(100,future/needed*100);el('required').textContent=fmt(needed);el('future').textContent=fmt(future);el('gap').textContent=fmt(gap);el('percent').textContent=Math.round(progress)+'%';el('fill').style.width=progress+'%';el('rateVal').textContent=v('rate')+'%';el('drawVal').textContent=v('draw')+'%';el('status').textContent=needed===0?'副業利益だけで生活費をまかなえる設定です。':future>=needed?'目標資産に届く試算です。ただし相場変動などに注意。':'目標資産まであと '+fmt(gap)+'。積立や副収入を調整してみよう。';summary=`MONEVA サイドFIRE診断\n${v('age')}歳 → ${v('target')}歳\n必要資産：${fmt(needed)}\n目標年齢の予想資産：${fmt(future)}\n不足額：${fmt(gap)}\n※税金・社会保険・相場変動等を除く概算`;}ids.forEach(id=>el(id).addEventListener('input',update));el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(summary);el('copy').textContent='コピーしました！';setTimeout(()=>el('copy').textContent='診断結果をコピー',1800)}catch(e){alert('コピーできない場合はスクリーンショットで保存してください。')}});update();</script></body></html>
